name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  issue_comment:
    types: [created]
jobs:
  test:
    timeout-minutes: 60
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/run-e2e')) ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request.head.ref || github.head_ref }}
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --reporter=junit
      env:
        CI: true
        # 如果测试需要访问受保护的接口或页面，在这里注入 Secrets
        # TEST_API_TOKEN: ${{ secrets.TEST_API_TOKEN }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload Playwright HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
    # 7. 解析测试结果，并自动评论到 PR
    - name: Post test results to PR
      if: always()
      uses: thollander/actions-comment-pull-request@v2
      with:
        message: |
          ### 🎭 Playwright E2E 测试结果

          **触发方式：** ${{ github.event_name == 'issue_comment' && '💬 评论触发 (`/run-e2e`)' || '🚀 PR 自动触发' }}
          **运行状态：** ${{ job.status == 'success' && '✅ 全部通过' || '❌ 存在失败' }}
          **执行时间：** ${{ github.event_name == 'issue_comment' && '手动触发' || '自动触发' }}

          > 📊 详细报告请点击 Actions 页面顶部的 "playwright-report" 产物下载查看。
        comment_tag: playwright-e2e-results
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
