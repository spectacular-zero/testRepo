name: Shortest E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shortest:
    name: Run Shortest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Shortest (headless)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOTP_SECRET: ${{ secrets.GITHUB_TOTP_SECRET }}
        run: npx shortest --headless
